name: Veesion conformance
description: >-
  Standards and regulatory conformance Veesion states on its own public pages. Veesion publishes
  a data-protection posture (EU GDPR / French Loi Informatique et Libertes, CNIL as supervisory
  authority, SCCs for third-country transfers) and asserts that its models perform no biometric
  identification. It publishes NO third-party certification — no SOC 2 report, ISO 27001
  certificate, PCI DSS attestation or trust center was found on any Veesion host, and
  probe-security-programs.py returned no trust center and no vulnerability-disclosure programme.
  Because there is no published machine-readable contract, none of the contract-borne conformance
  signals (OAuth2/OIDC metadata, RFC 9457 problem+json, pagination, idempotency) can be asserted
  either way; they are recorded as unknown rather than false.
